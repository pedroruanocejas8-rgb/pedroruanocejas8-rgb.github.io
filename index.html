<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navega</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;display:flex;justify-content:center;min-height:100vh}
  .app{width:min(900px,92%);padding:70px 20px}
  h1{text-align:center;font-size:42px;margin:0 0 12px}
  p{text-align:center;color:#6e6e73;margin-bottom:30px}
  .search{display:flex;background:white;border:1px solid #d2d2d7;border-radius:18px;padding:7px;box-shadow:0 8px 25px #00000012}
  input{flex:1;border:0;outline:0;font-size:18px;padding:14px;background:transparent}
  button{border:0;border-radius:13px;padding:0 22px;background:#007aff;color:white;font-size:16px;cursor:pointer}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:28px}
  .card{background:white;border:1px solid #e5e5ea;border-radius:16px;padding:20px;text-decoration:none;color:#1d1d1f;transition:.15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #00000012}
  .icon{font-size:28px}.name{font-weight:600;margin-top:10px}
  .url{font-size:13px;color:#86868b;margin-top:4px}
  .note{text-align:center;font-size:13px;color:#86868b;margin-top:30px}
</style>
</head>
<body>
<div class="app">
  <h1>🌐 Navega</h1>
  <p>Una página sencilla para buscar y acceder a tus webs favoritas.</p>

  <form class="search" onsubmit="buscar(event)">
    <input id="q" type="text" placeholder="Busca en Internet o escribe una dirección..." autocomplete="off">
    <button type="submit">Buscar</button>
  </form>

  <div class="cards">
    <a class="card" href="https://www.google.com"><div class="icon">🔎</div><div class="name">Google</div><div class="url">google.com</div></a>
    <a class="card" href="https://www.youtube.com"><div class="icon">▶️</div><div class="name">YouTube</div><div class="url">youtube.com</div></a>
    <a class="card" href="https://www.wikipedia.org"><div class="icon">📚</div><div class="name">Wikipedia</div><div class="url">wikipedia.org</div></a>
    <a class="card" href="https://www.roblox.com"><div class="icon">🎮</div><div class="name">Roblox</div><div class="url">roblox.com</div></a>
  </div>

  <div class="note">Funciona directamente en Safari. No necesita instalar nada.</div>
</div>

<script>
function buscar(e){
  e.preventDefault();
  const q=document.getElementById("q").value.trim();
  if(!q) return;
  const pareceUrl=/^(https?:\/\/|www\.)|\.[a-z]{2,}(\/|$)/i.test(q);
  if(pareceUrl){
    location.href=q.startsWith("http") ? q : "https://"+q;
  }else{
    location.href="https://www.google.com/search?q="+encodeURIComponent(q);
  }
}
</script>
</body>
</html>
